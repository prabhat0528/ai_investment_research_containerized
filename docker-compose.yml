version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quant-terminal-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quantterminal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quantterminal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: quant-terminal-backend
    restart: always
    ports:
      - "5005:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/quantterminal
      - DATABASE_SSL=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NOTIFICATIONS_GEMINI_KEY=${NOTIFICATIONS_GEMINI_KEY}
      - NOTIFICATIONS_GEMINI_KEY_BACKUP_1=${NOTIFICATIONS_GEMINI_KEY_BACKUP_1}
      - NOTIFICATIONS_GEMINI_KEY_BACKUP_2=${NOTIFICATIONS_GEMINI_KEY_BACKUP_2}
      - MAIN_GEMINI_KEY_BACKUP_1=${MAIN_GEMINI_KEY_BACKUP_1}
      - MAIN_GEMINI_KEY_BACKUP_2=${MAIN_GEMINI_KEY_BACKUP_2}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: quant-terminal-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://backend:5000
      - VITE_FINNHUB_API_KEY=${VITE_FINNHUB_API_KEY}
    depends_on:
      - backend

volumes:
  pgdata:
