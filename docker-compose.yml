version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quant-terminal-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quantterminal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quantterminal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: quant-terminal-backend
    restart: always
    ports:
      - "5005:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/quantterminal
      - DATABASE_SSL=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NOTIFICATIONS_GEMINI_KEY=${NOTIFICATIONS_GEMINI_KEY}
      - NOTIFICATIONS_GEMINI_KEY_BACKUP_1=${NOTIFICATIONS_GEMINI_KEY_BACKUP_1}
      - NOTIFICATIONS_GEMINI_KEY_BACKUP_2=${NOTIFICATIONS_GEMINI_KEY_BACKUP_2}
      - MAIN_GEMINI_KEY_BACKUP_1=${MAIN_GEMINI_KEY_BACKUP_1}
      - MAIN_GEMINI_KEY_BACKUP_2=${MAIN_GEMINI_KEY_BACKUP_2}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: quant-terminal-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://backend:5000
      - VITE_FINNHUB_API_KEY=${VITE_FINNHUB_API_KEY}
    depends_on:
      - backend

  # ==========================================
  # OBSERVABILITY & MONITORING STACK
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: quant-terminal-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: quant-terminal-grafana
    restart: always
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: quant-terminal-node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: quant-terminal-cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
